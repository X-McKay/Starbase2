<!doctype html>
<meta charset="utf-8">
<title>Starbase2 isolated Web review</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style>
<iframe id="game" title="Starbase2 Godot world" src="/game/?web-review=1"></iframe>
<output id="starbase-review-metrics" hidden></output>
<script>
// Read-only QA instrumentation around the exact, unchanged exported game.
const game = document.getElementById('game');
const output = document.getElementById('starbase-review-metrics');
let wallIntervals = [];
let wallWarmup = 30;
let previousRaf = null;

function percentile(values, fraction) {
  if (!values.length) return null;
  return values[Math.min(values.length - 1, Math.floor(values.length * fraction))];
}

function sampleWallClock(timestamp, expectedWindow) {
  if (game.contentWindow !== expectedWindow) return;
  if (previousRaf !== null) {
    if (wallWarmup > 0) wallWarmup -= 1;
    else if (wallIntervals.length < 600) wallIntervals.push(timestamp - previousRaf);
  }
  previousRaf = timestamp;
  if (wallIntervals.length < 600) expectedWindow.requestAnimationFrame(
    next => sampleWallClock(next, expectedWindow));
}

function awaitFirstDraw(expectedWindow) {
  if (game.contentWindow !== expectedWindow) return;
  const metrics = game.contentDocument?.getElementById('starbase-world-metrics');
  if (metrics) {
    const values = JSON.parse(metrics.textContent);
    if (values.navigation_to_first_post_draw_ms > 0) {
      expectedWindow.requestAnimationFrame(next => sampleWallClock(next, expectedWindow));
      return;
    }
  }
  expectedWindow.requestAnimationFrame(() => awaitFirstDraw(expectedWindow));
}

game.addEventListener('load', () => {
  wallIntervals = [];
  wallWarmup = 30;
  previousRaf = null;
  const expectedWindow = game.contentWindow;
  expectedWindow.requestAnimationFrame(() => awaitFirstDraw(expectedWindow));
});

setInterval(() => {
  const metrics = game.contentDocument?.getElementById('starbase-world-metrics');
  if (!metrics) return;
  const performance = game.contentWindow.performance;
  const snapshots = performance.getEntriesByType('resource')
    .filter(entry => new URL(entry.name).pathname === '/v2/snapshot')
    .map(entry => entry.duration).sort((a,b) => a-b);
  const godot = JSON.parse(metrics.textContent);
  const sortedWallIntervals = [...wallIntervals].sort((a,b) => a-b);
  output.textContent = JSON.stringify({
    game: {
      navigation_to_first_post_draw_ms: godot.navigation_to_first_post_draw_ms,
      godot_reported_process_delta_samples: godot.sample_count,
      godot_reported_process_delta_median_ms: godot.frame_interval_median_ms,
      godot_reported_process_delta_p95_ms: godot.frame_interval_p95_ms,
      texture_memory_bytes: godot.texture_memory_bytes,
      static_memory_bytes: godot.static_memory_bytes,
      viewport: godot.viewport,
      process_delta_scope: 'Godot _process(delta) values; fixed-step or engine scheduling may differ from browser presentation cadence',
    },
    browser_raf_wall_clock_samples: sortedWallIntervals.length,
    browser_raf_wall_clock_median_ms: percentile(sortedWallIntervals, .5),
    browser_raf_wall_clock_p95_ms: percentile(sortedWallIntervals, .95),
    browser_raf_wall_clock_complete: sortedWallIntervals.length === 600,
    snapshot_http_samples: snapshots.length,
    snapshot_http_median_ms: percentile(snapshots, .5),
    snapshot_http_p95_ms: percentile(snapshots, .95),
    browser: navigator.userAgent,
    scope: 'Local fixture HTTP request durations, Godot process deltas and child-frame requestAnimationFrame wall-clock intervals after first draw plus 30 warmup frames; rAF is presentation-callback cadence, not render CPU time, end-to-end UI latency or cold internet transfer',
  });
}, 1000);
</script>

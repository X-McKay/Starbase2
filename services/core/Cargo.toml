[package]
name = "starbase-core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.8"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
schemars = "=1.2.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
